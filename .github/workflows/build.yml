name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk BillLedger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BillLedger-apk
          path: BillLedger.apk

      # Keeps one download link that always has the newest app:
      # https://github.com/<owner>/<repo>/releases/latest/download/BillLedger.apk
      - name: Move the "latest" tag to this build
        if: github.event_name != 'pull_request'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bill Ledger — latest build
          make_latest: true
          files: BillLedger.apk
          body: |
            Newest build of Bill Ledger from commit ${{ github.sha }}.
            On your Android phone, download **BillLedger.apk** below, open it, and allow installing from your browser or Files app when asked.
